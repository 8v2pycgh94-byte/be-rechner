<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f1">
<title>BE-Rechner DFC</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1d2330; --muted: #5d6573;
  --line: #d9dbe0; --accent: #1f5c4a; --accent-fg: #ffffff; --chip: #eceee9;
  --warn: #8a5a00; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1d222b; --fg: #e8eaee; --muted: #9aa3b2;
    --line: #2f3642; --accent: #7fc4a8; --accent-fg: #0f1714; --chip: #262d38;
    --warn: #e0b060; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1d222b; --fg: #e8eaee; --muted: #9aa3b2;
  --line: #2f3642; --accent: #7fc4a8; --accent-fg: #0f1714; --chip: #262d38;
  --warn: #e0b060; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
main { max-width: 620px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--chip);
  border: 1px solid transparent; border-radius: 999px;
  padding: 8px 14px; cursor: pointer; min-height: 40px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 12px; }
@media (min-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }
.full { grid-column: 1 / -1; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type="number"] {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; background: var(--bg); color: var(--fg); border: 0; padding: 9px 14px; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
.result-be { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--accent); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin-top: 14px; font-variant-numeric: tabular-nums; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; font-weight: 600; }
.warn { color: var(--warn); font-size: 13px; margin-top: 12px; }
.check { display: flex; align-items: center; gap: 10px; color: var(--fg); margin-top: 14px; font-size: 14px; min-height: 40px; }
.check input { width: 20px; height: 20px; }
.row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
@media (min-width: 420px) { .row { grid-template-columns: 1fr 1fr; } }
.btn { font: inherit; font-size: 15px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 12px 14px; cursor: pointer; min-height: 46px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.scroll { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 300px; }
th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
th:not(:first-child), td:not(:first-child) { text-align: right; }
tr.total td { font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>BE- und Provisionsrechner</h1>
    <p class="sub">Stufe wählen, Sparte wählen, Beitrag eingeben. Sätze aus dem Karriereplan, Produkt-Courtagen kannst du überschreiben.</p>
  </header>

  <section class="card">
    <h2>1. Stufe</h2>
    <div class="chips" id="stages"></div>
    <p class="hint" id="stageHint"></p>
  </section>

  <section class="card">
    <h2>2. Sparte</h2>
    <div class="chips" id="sparten"></div>
  </section>

  <section class="card">
    <h2>3. Beitrag</h2>
    <div class="grid" id="inputs"></div>
  </section>

  <section class="card">
    <h2>Ergebnis</h2>
    <div class="result-be" id="beOut">0,00 BE</div>
    <p class="sub" id="beFormel"></p>
    <div class="kv" id="provOut"></div>
    <p class="warn" id="warnOut"></p>
    <label class="check">
      <input type="checkbox" id="gelb" checked> Produkt ist zuschussrelevant (gelb)
    </label>
    <div class="row">
      <button class="btn" id="save">Zur Liste hinzufügen</button>
      <button class="btn ghost" id="clear">Liste leeren</button>
    </div>
    <p class="hint" id="saveMsg"></p>
  </section>

  <section class="card">
    <h2>Meine Liste</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Sparte</th><th>BE</th><th>Abschluss €</th><th>Laufend €/J.</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <p class="hint" id="listEmpty">Noch keine Einträge.</p>
  </section>
</main>

<script>
const STAGES = [
  { n: 1, name: "Assistant",         th: 0,     apLe: 7,    bpLe: 0.5, apKv: 1.00, bpSach: 7,  bpKfz: 2.0 },
  { n: 2, name: "Junior Consultant", th: 2000,  apLe: 10,   bpLe: 0.6, apKv: 1.40, bpSach: 9,  bpKfz: 2.5 },
  { n: 3, name: "Consultant",        th: 6000,  apLe: 14,   bpLe: 0.7, apKv: 2.00, bpSach: 11, bpKfz: 3.0 },
  { n: 4, name: "Senior Consultant", th: 12000, apLe: 17.5, bpLe: 0.8, apKv: 2.45, bpSach: 13, bpKfz: 3.5 },
  { n: 5, name: "Sales Manager",     th: 30000, apLe: 23,   bpLe: 0.9, apKv: 3.20, bpSach: 15, bpKfz: 4.0 },
];

const SPARTEN = {
  le:   { label: "Leben",                       div: 143 },
  kv:   { label: "Kranken",                     div: 1 },
  suh:  { label: "Sach / Haftpflicht / Unfall", div: 7 },
  kfz:  { label: "Kfz",                         div: 50 },
  rs:   { label: "Rechtsschutz",                div: 7 },
  hypo: { label: "Hypothekendarlehen",          div: 400 },
  gkv:  { label: "GKV-Mitgliedschaft",          div: null },
};

// Eingabewerte bleiben beim Umschalten erhalten.
const state = { stage: 1, sparte: "le", jbMode: "mb", vals: {}, list: [] };

const $ = (id) => document.getElementById(id);
const fmt = (x) => x.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;

function val(id, def = 0) {
  const raw = state.vals[id];
  const v = parseFloat(String(raw ?? "").replace(",", "."));
  return isNaN(v) ? def : v;
}

function renderStages() {
  $("stages").innerHTML = STAGES.map(s =>
    `<button class="chip" data-stage="${s.n}" aria-pressed="${s.n === state.stage}">${s.n} · ${s.name}</button>`).join("");
  const s = STAGES[state.stage - 1];
  const th = s.th.toLocaleString("de-DE");
  $("stageHint").textContent = `Schwelle für diese Stufe: ${th} BE gesamt. Stufen 6 bis 9 sind noch nicht hinterlegt.`;
}

function renderSparten() {
  $("sparten").innerHTML = Object.entries(SPARTEN).map(([k, v]) =>
    `<button class="chip" data-sparte="${k}" aria-pressed="${k === state.sparte}">${v.label}</button>`).join("");
}

function field(id, label, ph = "", step = "any") {
  const v = state.vals[id] ?? "";
  return `<label>${label}<input id="${id}" type="number" inputmode="decimal" step="${step}" min="0" placeholder="${ph}" value="${v}"></label>`;
}

function courtageDefault() {
  const s = STAGES[state.stage - 1];
  return state.sparte === "kfz" ? s.bpKfz : s.bpSach;
}

function renderInputs() {
  const s = STAGES[state.stage - 1];
  const sp = state.sparte;
  let html = "";
  if (sp === "le") {
    html += field("bws", "Beitragssumme (BWS) in €", "10000");
    html += field("jbLe", "Jahresbeitrag in € (für Bestandspflege)", "600");
  } else if (sp === "kv") {
    html += field("mb", "Monatsbeitrag in €", "250");
    html += field("faktor", "MB-Faktor (Abschluss)", "1,00", "0.01");
    html += field("bpKv", "Bestandspflege-Satz in %", "0,5", "0.01");
  } else if (sp === "suh" || sp === "kfz" || sp === "rs") {
    html += `<div class="full"><div class="seg" role="group" aria-label="Beitragsart">
      <button data-jb="mb" aria-pressed="${state.jbMode === "mb"}">Monatsbeitrag</button>
      <button data-jb="jb" aria-pressed="${state.jbMode === "jb"}">Jahresbeitrag</button>
    </div></div>`;
    html += state.jbMode === "mb" ? field("mb", "Monatsbeitrag in €", "260") : field("jbIn", "Jahresbeitrag in €", "3120");
    html += field("courtage", `Courtage-Satz in % (Vorgabe Stufe ${s.n}: ${courtageDefault()} %)`, String(courtageDefault()), "0.01");
  } else if (sp === "hypo") {
    html += field("darlehen", "Darlehenssumme in €", "100000");
  } else if (sp === "gkv") {
    html += `<p class="full hint">Bei GKV-Mitgliedschaften werden pauschal 15 BE pro Vermittlung gutgeschrieben.</p>`;
    html += field("anzahl", "Anzahl Vermittlungen", "1", "1");
  }
  $("inputs").innerHTML = html;
  document.querySelectorAll("#inputs input").forEach(el => {
    el.addEventListener("input", () => { state.vals[el.id] = el.value; calc(); });
  });
}

function calc() {
  const s = STAGES[state.stage - 1];
  const sp = state.sparte;
  let be = 0, ap = 0, bp = 0, formel = "", warn = "", apLabel = null, bpLabel = null;

  if (sp === "le") {
    const bws = val("bws"), jb = val("jbLe");
    be = bws / 143;
    ap = bws * s.apLe / 1000;
    bp = jb * s.bpLe / 100;
    apLabel = "Abschluss"; bpLabel = "Laufend pro Jahr";
    formel = `BE = BWS ÷ 143 · Abschluss = BWS × ${s.apLe} ‰ · Bestand = JB × ${s.bpLe} %`;
    warn = "Bei Leben gibt es einen Vorschuss. Storno in der Haftungszeit zieht den nicht verdienten Teil ab, 10 % gehen auf die Stornoreserve.";
  } else if (sp === "kv") {
    const mb = val("mb"), f = val("faktor", 1), bpPct = val("bpKv", 0.5);
    be = mb;
    ap = mb * f * s.apKv;
    bp = mb * 12 * bpPct / 100;
    apLabel = "Abschluss"; bpLabel = "Laufend pro Jahr";
    formel = `BE = MB ÷ 1 · Abschluss = MB × ${f} × ${s.apKv} · Bestand = 12 × MB × ${bpPct} %`;
    warn = "Der Bestandspflege-Satz ist produktabhängig (0,23 % bis 0,50 %). Bitte aus der Produkttabelle prüfen.";
  } else if (sp === "suh" || sp === "kfz" || sp === "rs") {
    const div = SPARTEN[sp].div;
    const jb = state.jbMode === "mb" ? val("mb") * 12 : val("jbIn");
    const c = val("courtage", courtageDefault());
    be = jb / div;
    bp = jb * c / 100;
    bpLabel = "Laufend pro Jahr";
    formel = `BE = JB ÷ ${div} · Courtage = JB × ${c} %`;
    warn = state.jbMode === "mb" ? "Rechnung mit 12 × Monatsbeitrag. Enthält die Rate einen Ratenzuschlag, zieh ihn vorher ab." : "";
  } else if (sp === "hypo") {
    be = val("darlehen") / 400;
    formel = "BE = Darlehenssumme ÷ 400";
  } else if (sp === "gkv") {
    be = 15 * val("anzahl", 1);
    formel = "15 BE pro Vermittlung";
  }

  be = r2(be); ap = r2(ap); bp = r2(bp);
  if (!$("gelb").checked) warn = (warn ? warn + " " : "") + "Nicht zuschussrelevant: Diese BE zählen für den Zuschuss nicht.";

  $("beOut").textContent = fmt(be) + " BE";
  $("beFormel").textContent = formel;
  let kv = "";
  if (apLabel) kv += `<span class="k">${apLabel}</span><span class="v">${fmt(ap)} €</span>`;
  if (bpLabel) kv += `<span class="k">${bpLabel}</span><span class="v">${fmt(bp)} €</span>`;
  if (!apLabel && !bpLabel) kv = `<span class="k">Provision</span><span class="v">keine Formel hinterlegt</span>`;
  $("provOut").innerHTML = kv;
  $("warnOut").textContent = warn;
  return { be, ap, bp, sp };
}

function renderList() {
  const rows = state.list.map(e =>
    `<tr><td>${SPARTEN[e.sp].label}</td><td>${fmt(e.be)}</td><td>${fmt(e.ap)}</td><td>${fmt(e.bp)}</td></tr>`).join("");
  const sum = (k) => r2(state.list.reduce((a, e) => a + e[k], 0));
  $("listBody").innerHTML = rows + (state.list.length
    ? `<tr class="total"><td>Summe</td><td>${fmt(sum("be"))}</td><td>${fmt(sum("ap"))}</td><td>${fmt(sum("bp"))}</td></tr>` : "");
  $("listEmpty").hidden = state.list.length > 0;
  try { localStorage.setItem("be-liste", JSON.stringify(state.list)); } catch (_) {}
}

function refresh() { renderStages(); renderSparten(); renderInputs(); calc(); }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.stage) { state.stage = +t.dataset.stage; refresh(); }
  else if (t.dataset.sparte) { state.sparte = t.dataset.sparte; refresh(); }
  else if (t.dataset.jb) { state.jbMode = t.dataset.jb; refresh(); }
});
$("gelb").addEventListener("change", calc);

$("save").addEventListener("click", () => {
  const r = calc();
  if (r.be === 0 && r.ap === 0 && r.bp === 0) {
    $("saveMsg").textContent = "Bitte zuerst einen Beitrag oder eine Summe eingeben.";
    return;
  }
  state.list.push({ sp: r.sp, be: r.be, ap: r.ap, bp: r.bp });
  $("saveMsg").textContent = "Eintrag hinzugefügt.";
  renderList();
});
$("clear").addEventListener("click", () => {
  state.list = [];
  $("saveMsg").textContent = "";
  renderList();
});

try {
  const saved = JSON.parse(localStorage.getItem("be-liste") || "[]");
  if (Array.isArray(saved)) state.list = saved;
} catch (_) {}

renderList();
refresh();
</script>
</body>
</html>
